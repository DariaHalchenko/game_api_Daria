<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Game</h1>
</header>
<div id="app">
    <table id="gamesTable" class="table table-striped table-bordered">
        <tr>
            <th>Name</th>
            <th>Price (€)</th>
            <th>Actions</th>
        </tr>
        <tr v-for="game in games">
            <td @click="getGame(game.id)">{{ game.name }}</td>
            <td>{{ game.price }}</td>
            <!-- mängu eemaldamine ID järgi -->
            <td><button class="btn btn-danger btn-sm" @click="deleteGame(game.id)">Delete</button></td>
        </tr>
    </table>
    <div id="gameInfoModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <tr>
                            <th>ID</th>
                            <td>{{ gameInModal.id }}</td>
                        </tr>
                        <tr>
                            <th>Name</th>
                            <td>{{ gameInModal.name }}</td>
                        </tr>
                        <tr>
                            <th>Price</th>
                            <td>{{ gameInModal.price }}</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div class="form-container">
        <div class="card-form">
            <!-- Uue mängu lisamise vorm -->
            <h3>Add new Game</h3>
            <form @submit.prevent="addGame">
                <label for="name">Name:</label>
                <input type="text" v-model="newGame.name" id="name" required>
                <label for="price">Price (€):</label>
                <input type="number" v-model="newGame.price" id="price" step="0.01" required>
                <button type="submit" class="btn btn-success">Add Game</button>
            </form>
        </div>
        <div class="card-form">
            <!-- Mängu otsimine ID järgi -->
            <h3>Search for a game by ID</h3>
            <form @submit.prevent="searchGameById">
                <input type="number" v-model="searchId" id="searchId" placeholder="Enter game ID" required>
                <button type="submit" class="btn btn-primary">Search</button>
                <!-- Leitud mängu kuvamine -->
                <div v-if="foundGame" class="result-card">
                    <p><strong>ID:</strong> {{ foundGame.id }}</p>
                    <p><strong>Name:</strong> {{ foundGame.name }}</p>
                    <p><strong>Price:</strong> {{ foundGame.price }} €</p>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/vue@3.2.47/dist/vue.global.js"></script>
<script src="rest-client.js"></script>
</body>
</html>
